name: Integrate validated form and foundation feedback

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/integrate-redesign-form-foundations.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply validated frontend payloads
        run: |
          git fetch origin \
            5afa8aa1db63de4e19445c6e8fcc17b4c8295690 03176be6ba585c4f9f9651ac31626e28c2823863 \
            17e5a247d6c9396fa176eca4b853160538d480b0 2680106e6c4f5ab143c76822496084b872bf7ba7 \
            35bd4f2dd1f0d7e2c3c02f6fffcd8cfb9c29897c 870a80ee3238f4f6786cd27722911aa5fd8454b5 \
            e955206f4839ae6fc1abd135f002dadd9a64aa30 c12d7fa7aa861051f3504474dc7e609f868a8911 \
            1c0db1a52e32c4dba86de7b92deff570a2d77e74 962bbc0f6048395997fa05e119b0661e18721fe7

          git diff --binary 5afa8aa1db63de4e19445c6e8fcc17b4c8295690 03176be6ba585c4f9f9651ac31626e28c2823863 -- frontend | git apply --3way
          git diff --binary 17e5a247d6c9396fa176eca4b853160538d480b0 2680106e6c4f5ab143c76822496084b872bf7ba7 -- frontend | git apply --3way
          git diff --binary 35bd4f2dd1f0d7e2c3c02f6fffcd8cfb9c29897c 870a80ee3238f4f6786cd27722911aa5fd8454b5 -- frontend | git apply --3way
          git diff --binary e955206f4839ae6fc1abd135f002dadd9a64aa30 c12d7fa7aa861051f3504474dc7e609f868a8911 -- frontend | git apply --3way
          git diff --binary 1c0db1a52e32c4dba86de7b92deff570a2d77e74 962bbc0f6048395997fa05e119b0661e18721fe7 -- frontend | git apply --3way
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit integration and remove helper
        run: |
          rm .github/workflows/integrate-redesign-form-foundations.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend .github/workflows/integrate-redesign-form-foundations.yml
          git commit -m "fix(ui): integrate form navigation and design foundations"
          git push origin HEAD:feature/redesign
