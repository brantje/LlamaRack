name: Release qualification

on:
  workflow_call:
    inputs:
      cpu_image:
        description: CPU candidate image to qualify
        required: true
        type: string
      cuda_image:
        description: CUDA candidate image to qualify
        required: true
        type: string
      run_gpu:
        description: Run the self-hosted GPU qualification job
        required: false
        default: false
        type: boolean
      gpu_model_path:
        description: Dense GGUF path on the GPU runner host
        required: false
        default: /models/qualification.gguf
        type: string
      gpu_moe_model_path:
        description: MoE GGUF path on the GPU runner host
        required: false
        default: /models/qualification-moe.gguf
        type: string
      gpu_cycles:
        description: Number of dense lifecycle soak cycles
        required: false
        default: 8
        type: number
  workflow_dispatch:
    inputs:
      cpu_image:
        description: CPU candidate image to qualify
        required: true
        type: string
      cuda_image:
        description: CUDA candidate image to qualify
        required: true
        type: string
      run_gpu:
        description: Run the self-hosted GPU qualification job
        required: false
        default: false
        type: boolean
      gpu_model_path:
        description: Dense GGUF path on the GPU runner host
        required: false
        default: /models/qualification.gguf
        type: string
      gpu_moe_model_path:
        description: MoE GGUF path on the GPU runner host
        required: false
        default: /models/qualification-moe.gguf
        type: string
      gpu_cycles:
        description: Number of dense lifecycle soak cycles
        required: false
        default: 8
        type: number

permissions:
  contents: read
  packages: read

jobs:
  software:
    name: Software qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum
      - name: Run deterministic release scenarios
        run: |
          mkdir -p artifacts/release-qualification/software
          go version > artifacts/release-qualification/software/go-version.txt
          go env GOVERSION > artifacts/release-qualification/software/go-env-version.txt
          bash scripts/release-qualification/software.sh artifacts/release-qualification/software
      - name: Upload software qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-qualification-${{ github.run_id }}
          path: artifacts/release-qualification/software
          if-no-files-found: error

  containers:
    name: Candidate container qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact candidate images
        env:
          CPU_IMAGE: ${{ inputs.cpu_image }}
          CUDA_IMAGE: ${{ inputs.cuda_image }}
        run: |
          set -euo pipefail
          validate_image_ref() {
            [[ "$1" =~ ^ghcr\.io/brantje/llamarack@sha256:[0-9a-f]{64}$ ]] || {
              echo "candidate image must be an immutable ghcr.io/brantje/llamarack digest reference" >&2
              exit 2
            }
          }
          validate_image_ref "$CPU_IMAGE"
          validate_image_ref "$CUDA_IMAGE"
          docker pull "$CPU_IMAGE"
          docker pull "$CUDA_IMAGE"
      - name: Qualify CPU candidate
        env:
          QUALIFICATION_ARTIFACT_DIR: artifacts/release-qualification/containers
          CPU_IMAGE: ${{ inputs.cpu_image }}
        run: bash scripts/release-qualification/container-smoke.sh "$CPU_IMAGE" cpu
      - name: Qualify CUDA packaging without a GPU
        env:
          QUALIFICATION_ARTIFACT_DIR: artifacts/release-qualification/containers
          CUDA_IMAGE: ${{ inputs.cuda_image }}
        run: bash scripts/release-qualification/container-smoke.sh "$CUDA_IMAGE" cuda
      - name: Upload container qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-qualification-${{ github.run_id }}
          path: artifacts/release-qualification/containers
          if-no-files-found: error

  gpu:
    name: GPU lifecycle qualification
    if: ${{ inputs.run_gpu }}
    runs-on: [self-hosted, gpu-runner]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run real-hardware lifecycle soak
        env:
          QUALIFICATION_ARTIFACT_DIR: artifacts/release-qualification/gpu
          CUDA_IMAGE: ${{ inputs.cuda_image }}
          GPU_MODEL_PATH: ${{ inputs.gpu_model_path }}
          GPU_MOE_MODEL_PATH: ${{ inputs.gpu_moe_model_path }}
          GPU_CYCLES: ${{ inputs.gpu_cycles }}
        run: |
          set -euo pipefail
          [[ "$CUDA_IMAGE" =~ ^ghcr\.io/brantje/llamarack@sha256:[0-9a-f]{64}$ ]] || {
            echo "CUDA candidate must be an immutable ghcr.io/brantje/llamarack digest reference" >&2
            exit 2
          }
          [[ "$GPU_CYCLES" =~ ^[1-9][0-9]*$ ]] || {
            echo "gpu_cycles must be a positive integer" >&2
            exit 2
          }
          bash scripts/release-qualification/monitor-gpu-soak.sh "$QUALIFICATION_ARTIFACT_DIR" &
          monitor_pid=$!
          trap 'kill "$monitor_pid" >/dev/null 2>&1 || true' EXIT
          bash scripts/release-qualification/gpu-soak.sh \
            "$CUDA_IMAGE" \
            "$GPU_MODEL_PATH" \
            "$GPU_MOE_MODEL_PATH" \
            "$GPU_CYCLES"
          python3 scripts/release-qualification/verify-moe-evidence.py \
            "$QUALIFICATION_ARTIFACT_DIR/moe-worker-args.txt" 1
          wait "$monitor_pid"
          python3 scripts/release-qualification/analyze-manager-growth.py \
            "$QUALIFICATION_ARTIFACT_DIR/manager-resource-samples.tsv" \
            "$QUALIFICATION_ARTIFACT_DIR/manager-growth-summary.json"
          trap - EXIT
      - name: Upload GPU qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-qualification-${{ github.run_id }}
          path: artifacts/release-qualification/gpu
          if-no-files-found: error
