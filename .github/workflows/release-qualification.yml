name: Release qualification

on:
  workflow_call:
    inputs:
      cpu_image:
        description: CPU candidate image to qualify
        required: true
        type: string
      cuda_image:
        description: CUDA candidate image to qualify
        required: true
        type: string
      run_gpu:
        description: Run the self-hosted GPU qualification job
        required: false
        default: false
        type: boolean
      run_compat:
        description: Run live OpenAI/LiteLLM compatibility qualification
        required: false
        default: false
        type: boolean
      gpu_models_dir:
        description: Directory on the GPU runner host containing the qualification GGUFs
        required: false
        default: /home/node/github-runners/models
        type: string
      gpu_cycles:
        description: Number of dense lifecycle soak cycles
        required: false
        default: 8
        type: number
  workflow_dispatch:
    inputs:
      cpu_image:
        description: CPU candidate image to qualify
        required: true
        type: string
      cuda_image:
        description: CUDA candidate image to qualify
        required: true
        type: string
      run_gpu:
        description: Run the self-hosted GPU qualification job
        required: false
        default: false
        type: boolean
      run_compat:
        description: Run live OpenAI/LiteLLM compatibility qualification
        required: false
        default: false
        type: boolean
      gpu_models_dir:
        description: Directory on the GPU runner host containing the qualification GGUFs
        required: false
        default: /home/node/github-runners/models
        type: string
      gpu_cycles:
        description: Number of dense lifecycle soak cycles
        required: false
        default: 8
        type: number

permissions:
  contents: read
  packages: read

jobs:
  software:
    name: Software qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum
      - name: Run deterministic release scenarios
        run: |
          mkdir -p artifacts/release-qualification/software
          go version > artifacts/release-qualification/software/go-version.txt
          go env GOVERSION > artifacts/release-qualification/software/go-env-version.txt
          bash scripts/release-qualification/software.sh artifacts/release-qualification/software
      - name: Upload software qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-qualification-${{ github.run_id }}
          path: artifacts/release-qualification/software
          if-no-files-found: error

  containers:
    name: Candidate container qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact candidate images
        env:
          CPU_IMAGE: ${{ inputs.cpu_image }}
          CUDA_IMAGE: ${{ inputs.cuda_image }}
        run: |
          set -euo pipefail
          validate_image_ref() {
            [[ "$1" =~ ^ghcr\.io/brantje/llamarack@sha256:[0-9a-f]{64}$ ]] || {
              echo "candidate image must be an immutable ghcr.io/brantje/llamarack digest reference" >&2
              exit 2
            }
          }
          validate_image_ref "$CPU_IMAGE"
          validate_image_ref "$CUDA_IMAGE"
          docker pull "$CPU_IMAGE"
          docker pull "$CUDA_IMAGE"
      - name: Qualify CPU candidate
        env:
          QUALIFICATION_ARTIFACT_DIR: artifacts/release-qualification/containers
          CPU_IMAGE: ${{ inputs.cpu_image }}
        run: bash scripts/release-qualification/container-smoke.sh "$CPU_IMAGE" cpu
      - name: Qualify CUDA packaging without a GPU
        env:
          QUALIFICATION_ARTIFACT_DIR: artifacts/release-qualification/containers
          CUDA_IMAGE: ${{ inputs.cuda_image }}
        run: bash scripts/release-qualification/container-smoke.sh "$CUDA_IMAGE" cuda
      - name: Upload container qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-qualification-${{ github.run_id }}
          path: artifacts/release-qualification/containers
          if-no-files-found: error

  compatibility:
    name: OpenAI / LiteLLM compatibility
    if: ${{ inputs.run_compat }}
    runs-on: [self-hosted, gpu-runner]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify compatibility runner prerequisites
        env:
          CUDA_IMAGE: ${{ inputs.cuda_image }}
          GPU_MODELS_DIR: ${{ inputs.gpu_models_dir }}
        run: |
          set -euo pipefail
          [[ "$CUDA_IMAGE" =~ ^ghcr\.io/brantje/llamarack@sha256:[0-9a-f]{64}$ ]] || {
            echo "CUDA candidate must be an immutable ghcr.io/brantje/llamarack digest reference" >&2
            exit 2
          }
          for command in docker curl python3 node npm nvidia-smi; do
            command -v "$command" >/dev/null || { echo "missing command on gpu-runner: $command" >&2; exit 1; }
          done
          docker info >/dev/null
          nvidia-smi -L
          test -d "$GPU_MODELS_DIR" || { echo "qualification models directory not found: $GPU_MODELS_DIR" >&2; exit 1; }
      - name: Run real-client compatibility suite
        env:
          QUALIFICATION_ARTIFACT_DIR: artifacts/release-qualification/compatibility
          CUDA_IMAGE: ${{ inputs.cuda_image }}
          GPU_MODELS_DIR: ${{ inputs.gpu_models_dir }}
        run: bash scripts/release-qualification/compat-gpu.sh "$CUDA_IMAGE" "$GPU_MODELS_DIR"
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-qualification-${{ github.run_id }}
          path: artifacts/release-qualification/compatibility
          if-no-files-found: error

  gpu:
    name: GPU lifecycle qualification
    if: ${{ inputs.run_gpu }}
    runs-on: [self-hosted, gpu-runner]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run real-hardware lifecycle soak
        env:
          QUALIFICATION_ARTIFACT_DIR: artifacts/release-qualification/gpu
          CUDA_IMAGE: ${{ inputs.cuda_image }}
          GPU_MODELS_DIR: ${{ inputs.gpu_models_dir }}
          GPU_CYCLES: ${{ inputs.gpu_cycles }}
        run: |
          set -euo pipefail
          [[ "$CUDA_IMAGE" =~ ^ghcr\.io/brantje/llamarack@sha256:[0-9a-f]{64}$ ]] || {
            echo "CUDA candidate must be an immutable ghcr.io/brantje/llamarack digest reference" >&2
            exit 2
          }
          [[ "$GPU_CYCLES" =~ ^[1-9][0-9]*$ ]] || {
            echo "gpu_cycles must be a positive integer" >&2
            exit 2
          }
          test -d "$GPU_MODELS_DIR" || { echo "qualification models directory not found: $GPU_MODELS_DIR" >&2; exit 1; }
          bash scripts/release-qualification/monitor-gpu-soak.sh "$QUALIFICATION_ARTIFACT_DIR" &
          monitor_pid=$!
          trap 'kill "$monitor_pid" >/dev/null 2>&1 || true' EXIT
          bash scripts/release-qualification/gpu-soak.sh \
            "$CUDA_IMAGE" \
            "$GPU_MODELS_DIR" \
            "$GPU_CYCLES"
          python3 scripts/release-qualification/verify-moe-evidence.py \
            "$QUALIFICATION_ARTIFACT_DIR/moe-worker-args.txt" 1
          python3 scripts/release-qualification/verify-moe-evidence.py \
            "$QUALIFICATION_ARTIFACT_DIR/moe-large-worker-args.txt" 1
          if [[ -f "$QUALIFICATION_ARTIFACT_DIR/dense-multi-worker-args.txt" ]]; then
            python3 scripts/release-qualification/verify-dense-multi-evidence.py \
              "$QUALIFICATION_ARTIFACT_DIR/dense-multi-worker-args.txt"
          fi
          wait "$monitor_pid"
          python3 scripts/release-qualification/analyze-manager-growth.py \
            "$QUALIFICATION_ARTIFACT_DIR/manager-resource-samples.tsv" \
            "$QUALIFICATION_ARTIFACT_DIR/manager-growth-summary.json"
          trap - EXIT
      - name: Upload GPU qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-qualification-${{ github.run_id }}
          path: artifacts/release-qualification/gpu
          if-no-files-found: error
