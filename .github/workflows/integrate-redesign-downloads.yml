name: Integrate validated Downloads visual coverage

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/integrate-redesign-downloads.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Integrate validated Downloads coverage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin cbabe8eb0efd5d0f88976effa2248d45c283c4a6
          git cherry-pick cbabe8eb0efd5d0f88976effa2248d45c283c4a6
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Remove integration workflow and push
        run: |
          rm .github/workflows/integrate-redesign-downloads.yml
          git add .github/workflows/integrate-redesign-downloads.yml
          git commit -m "chore: remove Downloads integration helper"
          git push origin HEAD:feature/redesign
