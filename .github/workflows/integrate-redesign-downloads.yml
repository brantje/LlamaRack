name: Integrate validated Downloads visual coverage

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/integrate-redesign-downloads.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reapply validated Downloads visual coverage
        run: |
          git fetch origin 26356619b99aff7346b00f11aec0451c35580750
          git show 26356619b99aff7346b00f11aec0451c35580750:.github/scripts/patch-downloads-visual-states.py > /tmp/patch-downloads-visual-states.py
          python /tmp/patch-downloads-visual-states.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit integration and remove helper
        run: |
          rm .github/workflows/integrate-redesign-downloads.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/e2e/redesign-screenshots.spec.ts .github/workflows/integrate-redesign-downloads.yml
          git commit -m "test(ui): integrate Downloads lifecycle states"
          git push origin HEAD:feature/redesign
