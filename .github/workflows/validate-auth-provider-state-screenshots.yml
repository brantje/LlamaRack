name: Validate authentication provider state screenshots

on:
  push:
    branches:
      - test/auth-provider-state-screenshots
    paths:
      - .github/workflows/validate-auth-provider-state-screenshots.yml
      - .github/scripts/patch-auth-provider-state-screenshots.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/auth-provider-state-screenshots
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply authentication provider visual coverage
        run: |
          python .github/scripts/patch-auth-provider-state-screenshots.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated authentication provider coverage
        run: |
          rm .github/workflows/validate-auth-provider-state-screenshots.yml .github/scripts/patch-auth-provider-state-screenshots.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(ui): cover authentication provider states" -m "Capture Add/Edit provider modals, callback and stored-secret replacement context, provider test failure and recovery, and destructive delete confirmation across all screenshot viewports."
          git push origin HEAD:test/auth-provider-state-screenshots
