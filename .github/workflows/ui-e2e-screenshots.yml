name: README screenshot update

on:
  pull_request:
    paths:
      - '.github/workflows/ui-e2e-screenshots.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Add dashboard screenshot to README
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          anchor = "[![Nuxt](https://img.shields.io/badge/frontend-Nuxt-00DC82?logo=nuxtdotjs&logoColor=white)](./frontend)\n\n"
          addition = "[![LlamaRack dashboard](./screenshots/05-dashboard.png)](./screenshots.md)\n\n[View all screenshots →](./screenshots.md)\n\n"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('README badge anchor not found')
              text = text.replace(anchor, anchor + addition, 1)
              path.write_text(text)
          PY

      - name: Commit README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: feature dashboard screenshot in README'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
