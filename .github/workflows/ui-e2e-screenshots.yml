name: UI E2E screenshots

on:
  # push:
  #   branches:
  #     - feature/redesign
  #   paths:
  #     - 'frontend/**'
  #     - 'backend/**'
  #     - '.github/workflows/ui-e2e-screenshots.yml'
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture UI pages
        env:
          NUXT_PUBLIC_API_BASE: http://127.0.0.1:8888
        run: npm run test:e2e:screenshots

      - name: Upload UI screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-screenshots
          path: |
            frontend/artifacts/ux-screenshots
            frontend/artifacts/playwright-report
            frontend/artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
