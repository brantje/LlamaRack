name: UI E2E screenshots

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture UI pages
        env:
          NUXT_PUBLIC_API_BASE: http://127.0.0.1:8888
        run: npm run test:e2e:screenshots

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-screenshots-${{ github.run_id }}
          path: frontend/artifacts/ux-screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-playwright-${{ github.run_id }}
          path: |
            frontend/artifacts/playwright-report
            frontend/artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
