name: UI E2E screenshots

on:
  pull_request:
    paths:
      - '.github/workflows/ui-e2e-screenshots.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Download generated desktop screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/llamarack-screenshots
          gh run download 34028748514 \
            --name ui-e2e-screenshots-34028748514 \
            --dir /tmp/llamarack-screenshots

      - name: Normalize to exact 1920x1080
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          rm -rf screenshots
          mkdir -p screenshots
          for image in /tmp/llamarack-screenshots/desktop-wide-1920x1080/*.png; do
            convert "$image" -crop 1920x1080+0+0 +repage "screenshots/$(basename "$image")"
          done
          test "$(find screenshots -maxdepth 1 -name '*.png' | wc -l)" -eq 59
          identify -format '%wx%h\n' screenshots/*.png | sort -u | grep -qx '1920x1080'

      - name: Commit screenshots
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f screenshots
          git commit -m 'docs: add 1920x1080 screenshots'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
