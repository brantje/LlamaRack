name: Retry redesign feedback round eight

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/retry-redesign-feedback-round8.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed round eight patch
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/apply-redesign-feedback-round8.yml').read_text().splitlines()
          start_marker = '      - name: Apply guarded remaining review patch'
          end_marker = '      - name: Install frontend dependencies'
          start = lines.index(start_marker) + 1
          end = lines.index(end_marker)
          block = lines[start:end]
          if not block or block[0].strip() != 'run: |':
              raise SystemExit('unable to locate reviewed round eight run block')
          script = []
          for line in block[1:]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-round8.sh').write_text('\n'.join(script) + '\n')
          PY
          bash /tmp/apply-round8.sh
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/e2e/redesign-screenshots.spec.ts')
          source = path.read_text()
          old = "headers: { ...corsHeaders, 'content-type': 'text/event-stream', 'x-llamacpp-manager-request-id': 'req_playground_fixture' }"
          new = "headers: { ...corsHeaders, 'access-control-expose-headers': 'x-llamacpp-manager-request-id', 'content-type': 'text/event-stream', 'x-llamacpp-manager-request-id': 'req_playground_fixture' }"
          if source.count(old) != 1:
              raise SystemExit(f'expected one generated Playground fixture header, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated fixes and remove retry helper
        run: |
          rm .github/workflows/retry-redesign-feedback-round8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): close remaining operator review gaps" -m "Use an honest failed Playground phase for gateway/network failures, make Models horizontal overflow discoverable on mobile, and extend visual QA across Playground request states plus fresh/revoked API-key interactions."
          git push origin HEAD:feature/redesign
