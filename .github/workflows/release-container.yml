name: Release container

on:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  resolve-runtime:
    name: Resolve release identity and llama.cpp runtime
    if: ${{ github.event_name == 'push' || github.event.release.prerelease == true }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
      build_time: ${{ steps.identity.outputs.build_time }}
      release_tag: ${{ steps.runtime.outputs.release_tag }}
      build_tag: ${{ steps.runtime.outputs.build_tag }}
      cpu_image: ${{ steps.runtime.outputs.cpu_image }}
      cuda_image: ${{ steps.runtime.outputs.cuda_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve LlamaRack identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == 'release' ]]; then
            version='${{ github.event.release.tag_name }}'
            version="${version#v}"
            channel='release'
          else
            version='development'
            channel='development'
          fi
          [[ -n "$version" && "$version" != *[[:space:]]* ]] || { echo 'invalid LlamaRack version' >&2; exit 1; }
          build_time="$(git show -s --format=%cI "$GITHUB_SHA")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "build_time=${build_time}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest stable llama.cpp
        id: runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-qualification/resolve-llama-runtime.sh "$GITHUB_OUTPUT"

      - name: Resolution summary
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          CHANNEL: ${{ steps.identity.outputs.channel }}
          RELEASE_TAG: ${{ steps.runtime.outputs.release_tag }}
          BUILD_TAG: ${{ steps.runtime.outputs.build_tag }}
          CPU_IMAGE: ${{ steps.runtime.outputs.cpu_image }}
          CUDA_IMAGE: ${{ steps.runtime.outputs.cuda_image }}
        run: |
          {
            echo '## Release build identity'
            echo
            echo "- LlamaRack: \`${VERSION}\` (\`${GITHUB_SHA}\`, ${CHANNEL})"
            echo "- llama.cpp release: \`${RELEASE_TAG}\`"
            echo "- llama.cpp build: \`${BUILD_TAG}\`"
            echo "- CPU runtime: \`${CPU_IMAGE}\`"
            echo "- CUDA runtime: \`${CUDA_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-candidates:
    name: Build and smoke candidate images
    needs: resolve-runtime
    runs-on: ubuntu-latest
    outputs:
      cpu_image: ${{ steps.resolved-candidates.outputs.cpu_image }}
      cuda_image: ${{ steps.resolved-candidates.outputs.cuda_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/brantje/llamarack
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,format=short,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Docker metadata (CUDA)
        id: meta-cuda
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/brantje/llamarack
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}-cuda
            type=semver,pattern={{major}}.{{minor}}-cuda
            type=semver,pattern={{major}}-cuda
            type=raw,value=latest-cuda,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=main-cuda,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,suffix=-cuda,format=short,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Define candidate image tags
        id: candidate-tags
        run: |
          echo "cpu_tag=ghcr.io/brantje/llamarack:qualification-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "cuda_tag=ghcr.io/brantje/llamarack:qualification-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-cuda" >> "$GITHUB_OUTPUT"

      - name: Build CPU candidate locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            LLAMA_IMAGE=${{ needs.resolve-runtime.outputs.cpu_image }}
            LLAMARACK_VERSION=${{ needs.resolve-runtime.outputs.version }}
            LLAMARACK_COMMIT=${{ github.sha }}
            LLAMARACK_BUILD_TIME=${{ needs.resolve-runtime.outputs.build_time }}
            LLAMARACK_CHANNEL=${{ needs.resolve-runtime.outputs.channel }}
            LLAMARACK_VARIANT=cpu
            LLAMA_CPP_RELEASE=${{ needs.resolve-runtime.outputs.release_tag }}
            LLAMA_CPP_BUILD=${{ needs.resolve-runtime.outputs.build_tag }}
            LLAMA_CPP_IMAGE=${{ needs.resolve-runtime.outputs.cpu_image }}
          tags: llamarack-candidate-cpu:${{ github.sha }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.llamarack.build.reason=release
            io.llamarack.runtime.variant=cpu
            io.llamarack.llama.cpp.release=${{ needs.resolve-runtime.outputs.release_tag }}
            io.llamarack.llama.cpp.build=${{ needs.resolve-runtime.outputs.build_tag }}
            io.llamarack.llama.cpp.image=${{ needs.resolve-runtime.outputs.cpu_image }}
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu

      - name: Build CUDA candidate locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            LLAMA_IMAGE=${{ needs.resolve-runtime.outputs.cuda_image }}
            LLAMARACK_VERSION=${{ needs.resolve-runtime.outputs.version }}
            LLAMARACK_COMMIT=${{ github.sha }}
            LLAMARACK_BUILD_TIME=${{ needs.resolve-runtime.outputs.build_time }}
            LLAMARACK_CHANNEL=${{ needs.resolve-runtime.outputs.channel }}
            LLAMARACK_VARIANT=cuda
            LLAMA_CPP_RELEASE=${{ needs.resolve-runtime.outputs.release_tag }}
            LLAMA_CPP_BUILD=${{ needs.resolve-runtime.outputs.build_tag }}
            LLAMA_CPP_IMAGE=${{ needs.resolve-runtime.outputs.cuda_image }}
          tags: llamarack-candidate-cuda:${{ github.sha }}
          labels: |
            ${{ steps.meta-cuda.outputs.labels }}
            io.llamarack.build.reason=release
            io.llamarack.runtime.variant=cuda
            io.llamarack.llama.cpp.release=${{ needs.resolve-runtime.outputs.release_tag }}
            io.llamarack.llama.cpp.build=${{ needs.resolve-runtime.outputs.build_tag }}
            io.llamarack.llama.cpp.image=${{ needs.resolve-runtime.outputs.cuda_image }}
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,mode=max,scope=cuda

      - name: Smoke exact CPU build before publication
        env:
          QUALIFICATION_ARTIFACT_DIR: artifacts/release-qualification/prepublish
        run: bash scripts/release-qualification/container-smoke.sh 'llamarack-candidate-cpu:${{ github.sha }}' cpu

      - name: Smoke exact CUDA build before publication
        env:
          QUALIFICATION_ARTIFACT_DIR: artifacts/release-qualification/prepublish
        run: bash scripts/release-qualification/container-smoke.sh 'llamarack-candidate-cuda:${{ github.sha }}' cuda

      - name: Push qualified candidate images
        env:
          CPU_TAG: ${{ steps.candidate-tags.outputs.cpu_tag }}
          CUDA_TAG: ${{ steps.candidate-tags.outputs.cuda_tag }}
        run: |
          docker tag 'llamarack-candidate-cpu:${{ github.sha }}' "$CPU_TAG"
          docker push "$CPU_TAG"
          docker tag 'llamarack-candidate-cuda:${{ github.sha }}' "$CUDA_TAG"
          docker push "$CUDA_TAG"

      - name: Resolve immutable candidate digests
        id: resolved-candidates
        env:
          CPU_TAG: ${{ steps.candidate-tags.outputs.cpu_tag }}
          CUDA_TAG: ${{ steps.candidate-tags.outputs.cuda_tag }}
        run: |
          set -euo pipefail
          resolve_digest_ref() {
            local tag="$1" digest_ref
            docker pull "$tag" >/dev/null
            digest_ref="$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | grep -E '^ghcr\.io/brantje/llamarack@sha256:[0-9a-f]{64}$' \
              | head -n 1)"
            if [[ ! "$digest_ref" =~ ^ghcr\.io/brantje/llamarack@sha256:[0-9a-f]{64}$ ]]; then
              echo "failed to resolve immutable digest for $tag" >&2
              exit 1
            fi
            printf '%s' "$digest_ref"
          }
          echo "cpu_image=$(resolve_digest_ref "$CPU_TAG")" >> "$GITHUB_OUTPUT"
          echo "cuda_image=$(resolve_digest_ref "$CUDA_TAG")" >> "$GITHUB_OUTPUT"

      - name: Upload pre-publication smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepublish-container-smoke-${{ github.run_id }}
          path: artifacts/release-qualification/prepublish
          if-no-files-found: error

  qualify:
    name: Qualify candidate release
    needs: build-candidates
    uses: ./.github/workflows/release-qualification.yml
    with:
      cpu_image: ${{ needs.build-candidates.outputs.cpu_image }}
      cuda_image: ${{ needs.build-candidates.outputs.cuda_image }}
      run_gpu: ${{ github.event_name == 'release' }}
      run_compat: ${{ github.event_name == 'release' }}
      gpu_models_dir: ${{ vars.GPU_QUALIFICATION_MODELS_DIR || '/home/node/github-runners/models' }}
      gpu_cycles: 8
    secrets: inherit

  publish:
    name: Publish qualified tags
    if: ${{ github.event_name == 'push' || github.event.release.prerelease == true }}
    needs: [resolve-runtime, build-candidates, qualify]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/brantje/llamarack
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,format=short,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Docker metadata (CUDA)
        id: meta-cuda
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/brantje/llamarack
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}-cuda
            type=semver,pattern={{major}}.{{minor}}-cuda
            type=semver,pattern={{major}}-cuda
            type=raw,value=main-cuda,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,suffix=-cuda,format=short,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Pull qualified candidate images
        env:
          CPU_IMAGE: ${{ needs.build-candidates.outputs.cpu_image }}
          CUDA_IMAGE: ${{ needs.build-candidates.outputs.cuda_image }}
        run: |
          docker pull "$CPU_IMAGE"
          docker pull "$CUDA_IMAGE"

      - name: Publish CPU tags from qualified digest
        env:
          CPU_IMAGE: ${{ needs.build-candidates.outputs.cpu_image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$CPU_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Publish CUDA tags from qualified digest
        env:
          CUDA_IMAGE: ${{ needs.build-candidates.outputs.cuda_image }}
          TAGS: ${{ steps.meta-cuda.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$CUDA_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
