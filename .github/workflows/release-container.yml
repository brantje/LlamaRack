name: Release container

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-candidates:
    name: Build and smoke candidate images
    runs-on: ubuntu-latest
    outputs:
      cpu_image: ${{ steps.candidates.outputs.cpu_image }}
      cuda_image: ${{ steps.candidates.outputs.cuda_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/brantje/llamarack
            ghcr.io/brantje/llamacpp-manager
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=main,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=main-,format=short,enable=${{ github.event_name == 'push' }}

      - name: Docker metadata (CUDA)
        id: meta-cuda
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/brantje/llamarack
            ghcr.io/brantje/llamacpp-manager
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}-cuda
            type=semver,pattern={{major}}.{{minor}}-cuda
            type=semver,pattern={{major}}-cuda
            type=raw,value=latest-cuda,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=main-cuda,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=main-,suffix=-cuda,format=short,enable=${{ github.event_name == 'push' }}

      - name: Define candidate image references
        id: candidates
        run: |
          echo "cpu_image=ghcr.io/brantje/llamarack:qualification-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "cuda_image=ghcr.io/brantje/llamarack:qualification-${GITHUB_SHA}-cuda" >> "$GITHUB_OUTPUT"

      - name: Build CPU candidate locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: llamrack-candidate-cpu:${{ github.sha }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.llamarack.build.reason=release
            io.llamacpp-manager.build.reason=release
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu

      - name: Build CUDA candidate locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            LLAMA_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda
          tags: llamrack-candidate-cuda:${{ github.sha }}
          labels: |
            ${{ steps.meta-cuda.outputs.labels }}
            io.llamarack.build.reason=release
            io.llamacpp-manager.build.reason=release
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,mode=max,scope=cuda

      - name: Smoke exact CPU build before publication
        env:
          QUALIFICATION_ARTIFACT_DIR: artifacts/release-qualification/prepublish
        run: bash scripts/release-qualification/container-smoke.sh 'llamarack-candidate-cpu:${{ github.sha }}' cpu

      - name: Smoke exact CUDA build before publication
        env:
          QUALIFICATION_ARTIFACT_DIR: artifacts/release-qualification/prepublish
        run: bash scripts/release-qualification/container-smoke.sh 'llamarack-candidate-cuda:${{ github.sha }}' cuda

      - name: Push qualified candidate digests
        env:
          CPU_IMAGE: ${{ steps.candidates.outputs.cpu_image }}
          CUDA_IMAGE: ${{ steps.candidates.outputs.cuda_image }}
        run: |
          docker tag 'llamarack-candidate-cpu:${{ github.sha }}' "$CPU_IMAGE"
          docker push "$CPU_IMAGE"
          docker tag 'llamarack-candidate-cuda:${{ github.sha }}' "$CUDA_IMAGE"
          docker push "$CUDA_IMAGE"

      - name: Upload pre-publication smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepublish-container-smoke-${{ github.run_id }}
          path: artifacts/release-qualification/prepublish
          if-no-files-found: error

  qualify:
    name: Qualify candidate release
    needs: build-candidates
    uses: ./.github/workflows/release-qualification.yml
    with:
      cpu_image: ${{ needs.build-candidates.outputs.cpu_image }}
      cuda_image: ${{ needs.build-candidates.outputs.cuda_image }}
      run_gpu: ${{ github.event_name == 'release' }}
      gpu_model_path: ${{ vars.GPU_QUALIFICATION_MODEL_PATH || '/models/qualification.gguf' }}
      gpu_moe_model_path: ${{ vars.GPU_QUALIFICATION_MOE_MODEL_PATH || '/models/qualification-moe.gguf' }}
      gpu_cycles: 8
    secrets: inherit

  publish:
    name: Publish qualified tags
    needs: [build-candidates, qualify]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/brantje/llamarack
            ghcr.io/brantje/llamacpp-manager
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=main,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=main-,format=short,enable=${{ github.event_name == 'push' }}

      - name: Docker metadata (CUDA)
        id: meta-cuda
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/brantje/llamarack
            ghcr.io/brantje/llamacpp-manager
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}-cuda
            type=semver,pattern={{major}}.{{minor}}-cuda
            type=semver,pattern={{major}}-cuda
            type=raw,value=latest-cuda,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=main-cuda,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=main-,suffix=-cuda,format=short,enable=${{ github.event_name == 'push' }}

      - name: Pull qualified candidate images
        env:
          CPU_IMAGE: ${{ needs.build-candidates.outputs.cpu_image }}
          CUDA_IMAGE: ${{ needs.build-candidates.outputs.cuda_image }}
        run: |
          docker pull "$CPU_IMAGE"
          docker pull "$CUDA_IMAGE"

      - name: Publish CPU tags from qualified digest
        env:
          CPU_IMAGE: ${{ needs.build-candidates.outputs.cpu_image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$CPU_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Publish CUDA tags from qualified digest
        env:
          CUDA_IMAGE: ${{ needs.build-candidates.outputs.cuda_image }}
          TAGS: ${{ steps.meta-cuda.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$CUDA_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
