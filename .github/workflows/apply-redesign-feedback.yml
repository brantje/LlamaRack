name: Apply redesign feedback fixes

on:
  push:
    branches:
      - feature/redesign
    paths:
      - '.github/workflows/apply-redesign-feedback.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply guarded feedback patch
        run: python3 .github/scripts/apply-redesign-feedback.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run redesign screenshot suite
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE: http://127.0.0.1:8888
        run: npm run test:e2e:screenshots

      - name: Commit validated fixes and remove helpers
        shell: bash
        run: |
          rm .github/workflows/apply-redesign-feedback.yml
          rm .github/scripts/apply-redesign-feedback.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(frontend): correct redesign runtime states'
          git push origin HEAD:feature/redesign
