name: Validate admin dashboard degraded screenshot

on:
  push:
    branches:
      - test/admin-dashboard-degraded-screenshot
    paths:
      - .github/workflows/validate-admin-dashboard-degraded-screenshot.yml
      - .github/scripts/patch-admin-dashboard-degraded-screenshot.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/admin-dashboard-degraded-screenshot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply admin dashboard degraded-state coverage
        run: |
          python .github/scripts/patch-admin-dashboard-degraded-screenshot.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated admin dashboard coverage
        run: |
          rm .github/workflows/validate-admin-dashboard-degraded-screenshot.yml .github/scripts/patch-admin-dashboard-degraded-screenshot.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(ui): cover admin summary recovery" -m "Capture the Administration dashboard summary failure and verified Retry recovery across the six visual QA viewports."
          git push origin HEAD:test/admin-dashboard-degraded-screenshot
