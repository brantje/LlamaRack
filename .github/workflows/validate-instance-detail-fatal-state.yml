name: Validate Instance detail fatal state

on:
  push:
    branches:
      - fix/instance-detail-fatal-state
    paths:
      - .github/workflows/validate-instance-detail-fatal-state.yml
      - .github/scripts/patch-instance-detail-fatal-state.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instance-detail-fatal-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Instance detail fatal-state fix
        run: |
          python .github/scripts/patch-instance-detail-fatal-state.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated Instance detail fatal-state fix
        run: |
          rm .github/workflows/validate-instance-detail-fatal-state.yml .github/scripts/patch-instance-detail-fatal-state.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): separate Instance detail fatal errors" -m "Keep not-found/load failures authoritative with explicit Back and Retry recovery, while preserving scoped action and history errors on otherwise loaded Instance details."
          git push origin HEAD:fix/instance-detail-fatal-state
