name: "Temporary 175 review fixes"

on:
  push:
    branches:
      - perf/175-sqlite-off-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: perf/175-sqlite-off-v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply reviewed fixes
        run: |
          sed -i 's/err == nil || !strings.Contains(err.Error(), "started_at is required")/err == nil || err.Error() != "started_at is required"/' .github/temp-175-review-fixes.py
          python3 .github/temp-175-review-fixes.py
      - name: Format changed Go files
        run: |
          gofmt -w \
            backend/internal/auth/api_keys.go \
            backend/internal/auth/api_keys_cache.go \
            backend/internal/auth/api_keys_cache_test.go \
            backend/internal/auth/types.go \
            backend/internal/instances/hot_cache.go \
            backend/internal/instances/hot_cache_test.go \
            backend/internal/instances/service.go \
            backend/internal/observability/correlation.go \
            backend/internal/observability/writeback.go \
            backend/internal/observability/writeback_test.go \
            backend/internal/gateway/gateway.go \
            backend/internal/gateway/headers.go \
            backend/internal/gateway/overhead_locust_test.go \
            backend/internal/gateway/proxy.go
      - name: Validate affected backend packages
        working-directory: backend
        run: |
          go test ./internal/auth ./internal/instances ./internal/observability ./internal/gateway
          go test -race ./internal/auth ./internal/instances ./internal/observability ./internal/gateway
          go vet ./internal/auth ./internal/instances ./internal/observability ./internal/gateway
      - name: Commit fixes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address #175 review findings"
          git push origin HEAD:perf/175-sqlite-off-v1
