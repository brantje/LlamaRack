name: Integrate Add model loaded screenshot feedback

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/integrate-add-model-loaded-screenshots.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply validated Add model visual QA fixes
        run: |
          python .github/scripts/integrate-add-model-loaded-screenshots.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated Add model visual QA integration
        run: |
          rm .github/workflows/integrate-add-model-loaded-screenshots.yml .github/scripts/integrate-add-model-loaded-screenshots.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(ui): cover Add model loaded states" -m "Use state-based readiness for the populated local GGUF flow and add deterministic Vision, MTP, alternate-helper, metadata-failure, and Hugging Face remote screenshots."
          git push origin HEAD:feature/redesign
