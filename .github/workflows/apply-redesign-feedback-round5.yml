name: Apply redesign feedback round five

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/apply-redesign-feedback-round5.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded Playground mobile patch
        run: |
          python - <<'PY'
          from pathlib import Path
          NL = chr(10)

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:160]!r}')
              p.write_text(source.replace(old, new, 1))

          playground = 'frontend/app/pages/playground.vue'
          replace_once(playground, "const phase = ref<'cold' | 'generating' | 'completed' | ''>('')", "const phase = ref<'cold' | 'generating' | 'completed' | ''>('')" + NL + "const mobileParametersOpen = ref(false)")
          replace_once(playground, "const isLoaded = computed(() => runtimeState.value === 'READY')", "const isLoaded = computed(() => runtimeState.value === 'READY')" + NL + "const instanceOptions = computed(() => manager.instances.value.map(instance => ({ label: instance.id, value: instance.id })))")
          replace_once(playground, "function stopValues(value = parameters.stop) {", "function selectInstance(value: unknown) {" + NL + "  const id = String(value || '')" + NL + "  if (!manager.instances.value.some(instance => instance.id === id)) return" + NL + "  selectedInstanceID.value = id" + NL + "  rawDirty.value = false" + NL + "  syncRawRequest()" + NL + "}" + NL + NL + "function stopValues(value = parameters.stop) {")
          replace_once(playground, '<h1 class="font-mono text-[18px] font-semibold text-[var(--neutral-900)]">{{ selectedInstance?.id || \'Select an Instance\' }}</h1>', '<h1 class="min-w-0 break-all font-mono text-[16px] font-semibold text-[var(--neutral-900)] sm:text-[18px]">{{ selectedInstance?.id || \'Select an Instance\' }}</h1>')
          replace_once(playground, '      <Frame class="flex min-h-[38rem] min-w-0 flex-col p-0" data-testid="playground-thread">' + NL + '        <div class="min-h-0 flex-1 space-y-5 overflow-auto p-5">', '      <Frame class="flex min-h-[38rem] min-w-0 flex-col p-0" data-testid="playground-thread">' + NL + '        <div class="sticky top-0 z-10 border-b border-[var(--color-divider)] bg-[var(--color-surface)] p-3 xl:hidden" data-testid="playground-mobile-controls">' + NL + '          <div class="flex min-w-0 items-center gap-2">' + NL + '            <USelect :model-value="selectedInstanceID" :items="instanceOptions" value-key="value" class="min-w-0 flex-1 font-mono" aria-label="Playground Instance" data-testid="playground-mobile-instance" @update:model-value="selectInstance" />' + NL + '            <StatusTag :variant="runtimeVariant(runtimeState)">{{ runtimeState }}</StatusTag>' + NL + '            <AppButton intent="secondary" size="sm" data-testid="playground-mobile-parameters-toggle" :aria-expanded="mobileParametersOpen" @click="mobileParametersOpen = !mobileParametersOpen">Parameters</AppButton>' + NL + '          </div>' + NL + '          <div v-if="mobileParametersOpen" class="mt-3 grid grid-cols-2 gap-3 border-t border-[var(--color-divider)] pt-3" data-testid="playground-mobile-quick-parameters">' + NL + '            <UFormField label="temperature"><UInput v-model.number="parameters.temperature" data-testid="playground-mobile-temperature" type="number" step="0.05" class="font-mono tabular-nums" /></UFormField>' + NL + '            <UFormField label="top_p"><UInput v-model.number="parameters.topP" data-testid="playground-mobile-top-p" type="number" step="0.05" class="font-mono tabular-nums" /></UFormField>' + NL + '            <UFormField label="max_tokens"><UInput v-model.number="parameters.maxTokens" data-testid="playground-mobile-max-tokens" type="number" class="font-mono tabular-nums" /></UFormField>' + NL + '            <div class="flex items-end pb-2"><UCheckbox v-model="parameters.stream" label="stream" data-testid="playground-mobile-stream" /></div>' + NL + '            <p class="col-span-2 text-xs leading-5 text-[var(--neutral-700)]">Quick controls stay beside the composer on mobile. Advanced parameters and raw Request/Response inspection remain below the thread.</p>' + NL + '          </div>' + NL + '        </div>' + NL + NL + '        <div class="min-h-0 flex-1 space-y-5 overflow-auto p-5">')
          replace_once(playground, '          <div class="border-b border-[var(--color-divider)] p-4">', '          <div class="hidden border-b border-[var(--color-divider)] p-4 xl:block">')
          replace_once(playground, '@click="selectedInstanceID = instance.id; rawDirty = false; syncRawRequest()"', '@click="selectInstance(instance.id)"')
          replace_once(playground, "? 'border-[var(--color-accent)] bg-[var(--color-accent)] text-white'", "? 'border-[var(--color-accent)] bg-[var(--color-accent)] text-[var(--color-on-accent)]'")

          cleanup_test = 'frontend/test/playground-redesign-cleanup.nuxt.test.ts'
          replace_once(cleanup_test, "  it('uses the signed-in management bridge without a Playground API-key field', () => {", "  it('keeps mobile experiment controls next to the composer without duplicating the desktop Instance list', () => {" + NL + "    expect(source).toContain('data-testid=\"playground-mobile-controls\"')" + NL + "    expect(source).toContain('aria-label=\"Playground Instance\"')" + NL + "    expect(source).toContain('data-testid=\"playground-mobile-parameters-toggle\"')" + NL + "    expect(source).toContain('data-testid=\"playground-mobile-quick-parameters\"')" + NL + "    expect(source).toContain('Quick controls stay beside the composer on mobile.')" + NL + "    expect(source).toContain('hidden border-b border-[var(--color-divider)] p-4 xl:block')" + NL + "    expect(source).toContain('text-[16px] font-semibold')" + NL + "    expect(source).toContain('text-[var(--color-on-accent)]')" + NL + "    expect(source).not.toContain('bg-[var(--color-accent)] text-white')" + NL + "  })" + NL + NL + "  it('uses the signed-in management bridge without a Playground API-key field', () => {")

          playground_test = 'frontend/test/playground.nuxt.test.ts'
          replace_once(playground_test, "    expect(wrapper.find('#playground-api-key').exists()).toBe(false)", "    expect(wrapper.find('#playground-api-key').exists()).toBe(false)" + NL + "    expect(wrapper.get('[data-testid=\"playground-mobile-controls\"]').exists()).toBe(true)" + NL + "    expect(wrapper.find('[data-testid=\"playground-mobile-quick-parameters\"]').exists()).toBe(false)" + NL + "    await wrapper.get('[data-testid=\"playground-mobile-parameters-toggle\"]').trigger('click')" + NL + "    await flushPromises()" + NL + "    expect(wrapper.get('[data-testid=\"playground-mobile-quick-parameters\"]').text()).toContain('Quick controls stay beside the composer on mobile.')" + NL + "    expect(wrapper.get('[data-testid=\"playground-mobile-parameters-toggle\"]').attributes('aria-expanded')).toBe('true')")
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated fixes and remove helper
        run: |
          rm .github/workflows/apply-redesign-feedback-round5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): streamline Playground mobile controls" -m "Keep Instance selection and essential parameters beside the mobile composer, reduce long-slug pressure at narrow widths, preserve advanced Request/Response inspection below the thread, and use the semantic on-accent foreground for selected Instances."
          git push origin HEAD:feature/redesign
