name: Validate Administration System feedback

on:
  push:
    branches:
      - fix/admin-system-cookie-explanation
    paths:
      - .github/workflows/validate-admin-system-cookie-explanation.yml
      - .github/scripts/patch-admin-system-cookie-explanation.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-system-cookie-explanation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Administration System fixes
        run: |
          python .github/scripts/patch-admin-system-cookie-explanation.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated Administration System fix
        run: |
          rm .github/workflows/validate-admin-system-cookie-explanation.yml .github/scripts/patch-admin-system-cookie-explanation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): explain disabled secure cookies" -m "Explain the derived HTTP secure-cookie state and cover the existing llama.cpp unavailable warning across all screenshot viewports."
          git push origin HEAD:fix/admin-system-cookie-explanation
