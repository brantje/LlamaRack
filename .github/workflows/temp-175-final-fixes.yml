name: Temporary #175 final fixes

on:
  push:
    branches:
      - perf/175-sqlite-off-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor == 'brantje' && github.ref == 'refs/heads/perf/175-sqlite-off-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum
      - name: Apply exact reviewed fixes
        run: python3 .github/temp-175-final-fixes.py
      - name: Format
        run: |
          gofmt -w \
            backend/internal/observability/writeback.go \
            backend/internal/observability/writeback_test.go \
            backend/internal/observability/writeback_coverage_test.go \
            backend/internal/gateway/overhead_locust_test.go
      - name: Test permanent writeback drain regression
        id: permanent
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          go test -v ./internal/observability -run '^TestWritebackFlushDropsPermanentFailuresAndDrainsRemainingBatches$' 2>&1 | tee ../permanent-writeback.log
      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permanent-writeback-log
          path: permanent-writeback.log
      - name: Stop on permanent regression failure
        if: steps.permanent.outcome == 'failure'
        run: exit 1
      - name: Test rich writeback pre-flush regression
        working-directory: backend
        run: go test -v ./internal/observability -run '^TestWritebackPersistsRichContextAndResponseState$'
      - name: Test observability package
        working-directory: backend
        run: go test ./internal/observability
      - name: Test gateway package
        working-directory: backend
        run: go test ./internal/gateway
      - name: Race affected packages
        working-directory: backend
        run: go test -race ./internal/observability ./internal/gateway
      - name: Vet affected packages
        working-directory: backend
        run: go vet ./internal/observability ./internal/gateway
      - name: Commit fixes and remove temporary tooling
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/observability/writeback.go \
                  backend/internal/observability/writeback_test.go \
                  backend/internal/observability/writeback_coverage_test.go \
                  backend/internal/gateway/overhead_locust_test.go
          git rm .github/temp-175-final-fixes.py .github/workflows/temp-175-final-fixes.yml
          git diff --cached --check
          git commit -m "fix: finish #175 writeback qualification"
          git push origin HEAD:perf/175-sqlite-off-v1
