name: Compatibility suite validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/compat/node/package-lock.json
      - name: Validate compatibility contract and Python probes
        run: |
          python3 tests/compat/validate_contract.py
          python3 -m py_compile tests/compat/*.py
          python3 -m unittest discover -s tests/compat -p 'test_*.py'
      - name: Validate qualification shell runners
        run: |
          bash -n scripts/release-qualification/compat.sh
          bash -n scripts/release-qualification/compat-gpu.sh
      - name: Validate pinned OpenAI Node client
        working-directory: tests/compat/node
        run: |
          npm ci --ignore-scripts
          node --check openai-probe.mjs
          node -e "const p=require('./node_modules/openai/package.json'); if (p.version !== '7.9.0') throw new Error('unexpected OpenAI Node version '+p.version)"

  apply-pr183-fixes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/180-stable-resource-identities'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/180-stable-resource-identities
          fetch-depth: 0
      - name: Apply guarded fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'backend/internal/api/server.go',
              '''\tinstance, err := s.lifecycle.Instances().GetBySlug(r.Context(), parts[0])
\tif err != nil {
\t\twriteResourceLookupError(w, "instance", err)
\t\treturn
\t}
''',
              '''\tinstance, err := s.lifecycle.Instances().GetBySlug(r.Context(), parts[0])
\tif errors.Is(err, sql.ErrNoRows) {
\t\t// Transitional compatibility for durable-ID management links. Frontend
\t\t// navigation remains canonical on the public slug route.
\t\tinstance, err = s.lifecycle.Instances().GetByID(r.Context(), parts[0])
\t}
\tif err != nil {
\t\twriteResourceLookupError(w, "instance", err)
\t\treturn
\t}
''',
          )
          replace_once(
              'backend/internal/database/resource_identity_migration_failures_test.go',
              '''\t\tif err := backfillModelSlugs(ctx, tx); err == nil || !strings.Contains(strings.ToLower(err.Error()), "slug") {
\t\t\tt.Fatalf("backfillModelSlugs write error=%v", err)
\t\t}
''',
              '''\t\tif err := backfillModelSlugs(ctx, tx); err == nil || strings.ToLower(err.Error()) != "sql logic error: no such column: slug (1)" {
\t\t\tt.Fatalf("backfillModelSlugs write error=%v", err)
\t\t}
''',
          )

          p = Path('backend/internal/database/resource_identity_migration_test.go')
          text = p.read_text()
          for old, new in [
              ('''\t}\n\trows.Close()\n\tif len(instances) != 2''', '''\t}\n\tif err := rows.Err(); err != nil {\n\t\tt.Fatal(err)\n\t}\n\trows.Close()\n\tif len(instances) != 2'''),
              ('''\t}\n\trows.Close()\n\tif models["model-a"] != "qwen-coder"''', '''\t}\n\tif err := rows.Err(); err != nil {\n\t\tt.Fatal(err)\n\t}\n\trows.Close()\n\tif models["model-a"] != "qwen-coder"'''),
              ('''\tfor rows.Next() {\n\t\tviolations++\n\t}\n\trows.Close()''', '''\tfor rows.Next() {\n\t\tviolations++\n\t}\n\tif err := rows.Err(); err != nil {\n\t\tt.Fatal(err)\n\t}\n\trows.Close()'''),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'resource_identity_migration_test.go: expected one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          replace_once(
              'frontend/test/instances-redesign.nuxt.test.ts',
              '''expect(readyCard.find('[data-testid="instance-id"]').text()).toBe(durableID('ready'))''',
              '''expect(readyCard.find('[data-testid="instance-id"]').text()).toBe('ready')''',
          )
          replace_once(
              'frontend/test/dashboard-branches.nuxt.test.ts',
              '''{ id: 1, started_at: 0, finished_at: 0, instance_id: 'starting', endpoint: '/v1/chat/completions' ''',
              '''{ id: 1, started_at: 0, finished_at: 0, instance_id: 'starting', model_slug: 'starting', endpoint: '/v1/chat/completions' ''',
          )
          p = Path('frontend/test/dashboard.nuxt.test.ts')
          text = p.read_text()
          old = "instance_id: 'coder', endpoint: '/v1/chat/completions'"
          count = text.count(old)
          if count < 3:
              raise SystemExit(f'dashboard.nuxt.test.ts: expected at least 3 coder request matches, found {count}')
          text = text.replace(old, "instance_id: 'coder', model_slug: 'coder', endpoint: '/v1/chat/completions'", 3)
          p.write_text(text)
          PY
      - name: Restore workflow files and commit
        run: |
          git show HEAD^:.github/workflows/compat-validation.yml > .github/workflows/compat-validation.yml
          rm -f .github/workflows/apply-pr183-cr-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/api/server.go backend/internal/database/resource_identity_migration_failures_test.go backend/internal/database/resource_identity_migration_test.go frontend/test/instances-redesign.nuxt.test.ts frontend/test/dashboard-branches.nuxt.test.ts frontend/test/dashboard.nuxt.test.ts .github/workflows/compat-validation.yml .github/workflows/apply-pr183-cr-followup.yml
          git diff --cached --check
          git commit -m "Address CodeRabbit follow-up feedback"
          git push origin HEAD:fix/180-stable-resource-identities
