name: Temporary PR feedback patch

on:
  push:
    branches:
      - fix/openai-compat-response-models

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Apply patch
        run: python3 .github/pr161_feedback_fix.py
      - name: Format
        run: |
          gofmt -w \
            backend/internal/gateway/gateway.go \
            backend/internal/gateway/gateway_test.go \
            backend/internal/gateway/request_body_limit_test.go \
            backend/internal/supervisor/security_test.go
      - name: Test focused packages
        working-directory: backend
        run: go test ./internal/gateway ./internal/supervisor ./internal/llamacpp
      - name: Commit clean fix
        run: |
          git show 5c77b0e2703d6b6902f57109cc7bfb123ed0c1de:.github/workflows/compat-validation.yml > .github/workflows/compat-validation.yml
          rm .github/pr161_feedback_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/gateway/gateway.go \
                  backend/internal/gateway/gateway_test.go \
                  backend/internal/gateway/request_body_limit_test.go \
                  backend/internal/supervisor/security_test.go \
                  .github/workflows/compat-validation.yml \
                  .github/pr161_feedback_fix.py
          git commit -m "fix: address PR review feedback"
          git push origin HEAD:fix/openai-compat-response-models
