name: Integrate validated operations UX feedback

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/integrate-redesign-ops-feedback.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply validated operations UX payloads
        run: |
          git fetch origin \
            4bae38940d6bb71ec22eda0e7a27ce49cc53c0c6 \
            5ece113527dc2f09b0b5af1722d6596226ee4555 \
            bfc8459e9e069b5cef35cace0b6dd93e970c40c3 \
            640a59339e0bd274949b36eff37b8594dfb17b47 \
            73e26d3b2e47f4915ad65af9291c229b21039f09 \
            e23217470b3e6bf503c69d1f03546ba58931e5a7

          git diff --binary 4bae38940d6bb71ec22eda0e7a27ce49cc53c0c6 5ece113527dc2f09b0b5af1722d6596226ee4555 -- \
            frontend/app/pages/instances/index.vue \
            frontend/test/redesign-feedback.nuxt.test.ts \
            frontend/test/instances-controls-accessibility.nuxt.test.ts \
            frontend/e2e/redesign-screenshots.spec.ts | git apply --3way

          git diff --binary bfc8459e9e069b5cef35cace0b6dd93e970c40c3 640a59339e0bd274949b36eff37b8594dfb17b47 -- \
            frontend/app/pages/logs/index.vue \
            frontend/test/request-logs-filter-collapse.nuxt.test.ts \
            frontend/test/request-logs-branches.nuxt.test.ts | git apply --3way

          git diff --binary 73e26d3b2e47f4915ad65af9291c229b21039f09 e23217470b3e6bf503c69d1f03546ba58931e5a7 -- \
            frontend/app/pages/index.vue \
            frontend/test/dashboard-redesign.nuxt.test.ts \
            frontend/e2e/redesign-screenshots.spec.ts | git apply --3way

          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit integration and remove helper
        run: |
          rm .github/workflows/integrate-redesign-ops-feedback.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/app/pages/instances/index.vue frontend/app/pages/logs/index.vue frontend/app/pages/index.vue \
            frontend/test/redesign-feedback.nuxt.test.ts frontend/test/instances-controls-accessibility.nuxt.test.ts \
            frontend/test/request-logs-filter-collapse.nuxt.test.ts frontend/test/request-logs-branches.nuxt.test.ts \
            frontend/test/dashboard-redesign.nuxt.test.ts frontend/e2e/redesign-screenshots.spec.ts \
            .github/workflows/integrate-redesign-ops-feedback.yml
          git commit -m "fix(ui): integrate operations redesign feedback"
          git push origin HEAD:feature/redesign
