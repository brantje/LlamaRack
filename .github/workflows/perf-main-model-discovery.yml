name: Performance - model discovery and model list

on:
  push:
    branches:
      - perf/main-model-discovery

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Resolve Go modules
        run: go mod tidy
      - name: Prepare measured baseline
        run: |
          git -C "$GITHUB_WORKSPACE" worktree add "$RUNNER_TEMP/baseline" 497f7716e370b9d30bb0051e767282f294b7b4c5
          cp "$GITHUB_WORKSPACE/backend/internal/models/service_benchmark_test.go" "$RUNNER_TEMP/baseline/backend/internal/models/service_benchmark_test.go"
          (cd "$RUNNER_TEMP/baseline/backend" && go mod tidy)
      - name: Baseline benchmark samples
        run: |
          cd "$RUNNER_TEMP/baseline/backend"
          go test -run='^$' -bench='^(BenchmarkAvailableGGUFs(20|Split16)|BenchmarkListModels100.*)$' -benchmem -count=10 ./internal/models > "$RUNNER_TEMP/before.txt"
          cat "$RUNNER_TEMP/before.txt"
      - name: Optimized benchmark samples
        run: |
          go test -run='^$' -bench='^(BenchmarkAvailableGGUFs(20|Split16)|BenchmarkListModels100.*)$' -benchmem -count=10 ./internal/models > "$RUNNER_TEMP/after.txt"
          cat "$RUNNER_TEMP/after.txt"
      - name: Benchstat comparison
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          benchstat "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"
      - name: Model list CPU and allocation profile
        run: go test -run='^$' -bench='^BenchmarkListModels100$' -benchtime=3s -cpuprofile=list-cpu.out -memprofile=list-mem.out ./internal/models
      - name: Model list CPU profile top
        run: go tool pprof -top -nodecount=25 list-cpu.out
      - name: Model list allocation profile top
        run: go tool pprof -top -alloc_space -nodecount=25 list-mem.out
      - name: Race detector
        run: go test -race ./...
