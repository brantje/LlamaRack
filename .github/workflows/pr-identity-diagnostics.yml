name: PR identity diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum
      - name: Run backend tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          go test ./... -count=1 2>&1 | tee /tmp/backend-tests.log
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/backend-tests.status
          exit 0
      - name: Upload backend diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: identity-backend-test-output-${{ github.run_id }}
          path: |
            /tmp/backend-tests.log
            /tmp/backend-tests.status
            backend/internal/api
            backend/internal/gateway
            backend/internal/instances
            backend/internal/lifecycle
            backend/internal/litellm
            backend/internal/models

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run test:coverage 2>&1 | tee /tmp/frontend-tests.log
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/frontend-tests.status
          exit 0
      - name: Upload frontend diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: identity-frontend-test-output-${{ github.run_id }}
          path: |
            /tmp/frontend-tests.log
            /tmp/frontend-tests.status
            frontend/app
            frontend/test
