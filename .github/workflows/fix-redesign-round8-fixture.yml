name: Fix redesign round eight fixture

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/fix-redesign-round8-fixture.yml

permissions:
  contents: write

jobs:
  fix-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - name: Expose Playground request id in fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-redesign-feedback-round8.yml')
          source = path.read_text()
          old = "headers: { ...corsHeaders, 'content-type': 'text/event-stream', 'x-llamacpp-manager-request-id': 'req_playground_fixture' }"
          new = "headers: { ...corsHeaders, 'access-control-expose-headers': 'x-llamacpp-manager-request-id', 'content-type': 'text/event-stream', 'x-llamacpp-manager-request-id': 'req_playground_fixture' }"
          if source.count(old) != 1:
              raise SystemExit(f'expected one Playground fixture header, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit corrected validator
        run: |
          rm .github/workflows/fix-redesign-round8-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: expose Playground fixture request id"
          git push origin HEAD:feature/redesign
