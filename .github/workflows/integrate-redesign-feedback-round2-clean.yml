name: Integrate validated redesign feedback round two

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/integrate-redesign-feedback-round2-clean.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Integrate green redesign fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git cherry-pick \
            f1c1868f9f0774fed3f7f797c6d4176bc8cead0c \
            80f89e881d2515a38587c68756c8efce77af425a \
            3a07348e5761d71741d5713562925cc07f66c733 \
            1b8358e1fcae30c25d814332beee34efe26f1ab8 \
            11d55bd573e3931fbba96166ed78fa24b7bb8496 \
            2e74e0099cfd4014149ba86f8e8e274993d5d9e4 \
            285ccd3ff8b453041148dc35c6b956310f892165 \
            fc2a48803feb2757e763d89f6d0c18e0fb98d8f4 \
            b9e90e3ac6cabb4910c27d951c37f105419134e7
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Remove integration workflow and push
        run: |
          git rm .github/workflows/integrate-redesign-feedback-round2-clean.yml
          git commit -m "chore: remove redesign integration helper"
          git push origin HEAD:feature/redesign
