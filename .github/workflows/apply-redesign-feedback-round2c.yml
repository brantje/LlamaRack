name: Apply redesign feedback round two final

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/apply-redesign-feedback-round2c.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply previously validated guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          e2e_path = Path('frontend/e2e/redesign-screenshots.spec.ts')
          e2e = e2e_path.read_text()
          for row in [
              "  ['request-logs-trace', '/logs?trace_id=trace_fixture'],\n",
              "  ['request-log-detail', '/logs?request_id=req_a1b2c3&session_id=session_fixture'],\n",
          ]:
              if e2e.count(row) != 1:
                  raise SystemExit(f'expected existing screenshot row exactly once: {row.strip()}')
              e2e = e2e.replace(row, '', 1)
          e2e_path.write_text(e2e)

          workflow = Path('.github/workflows/apply-redesign-feedback-round2b.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          patch = dedent('\n'.join(workflow[start:end]))
          exec(compile(patch, 'redesign-feedback-round2b-patch.py', 'exec'), {})

          # Preserve the existing screenshot artifact name while keeping the same trace route.
          e2e = e2e_path.read_text()
          old = "  ['request-log-trace', '/logs?trace_id=trace_fixture'],\n"
          new = "  ['request-logs-trace', '/logs?trace_id=trace_fixture'],\n"
          if e2e.count(old) != 1:
              raise SystemExit('expected patched request-log-trace screenshot row exactly once')
          e2e_path.write_text(e2e.replace(old, new, 1))
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npx playwright test e2e/redesign-screenshots.spec.ts
      - name: Commit validated fixes and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-redesign-feedback-round2.yml \
             .github/workflows/apply-redesign-feedback-round2b.yml \
             .github/workflows/apply-redesign-feedback-round2c.yml
          git add frontend .github/workflows/apply-redesign-feedback-round2.yml .github/workflows/apply-redesign-feedback-round2b.yml .github/workflows/apply-redesign-feedback-round2c.yml
          git diff --cached --check
          git commit -m 'fix(ui): address redesign review feedback' -m 'Resolve cross-page contrast, responsive action hierarchy, mobile overflow affordances, and ambiguous empty states identified in the redesign UX review. Expand deterministic visual fixtures for key loaded and recovery states.'
          git push origin HEAD:feature/redesign
