name: Validate Model details state screenshots

on:
  push:
    branches:
      - test/model-details-state-screenshots
    paths:
      - .github/workflows/validate-model-details-state-screenshots.yml
      - .github/scripts/patch-model-details-state-screenshots.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/model-details-state-screenshots
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Model details state screenshot coverage
        run: |
          python .github/scripts/patch-model-details-state-screenshots.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated Model details state coverage
        run: |
          rm .github/workflows/validate-model-details-state-screenshots.yml .github/scripts/patch-model-details-state-screenshots.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(ui): cover Model details states" -m "Capture filtered no-match, populated page-two, and API-failure states across all six screenshot viewports without changing Model details production behavior."
          git push origin HEAD:test/model-details-state-screenshots
