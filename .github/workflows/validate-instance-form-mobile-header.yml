name: Validate Instance form mobile header feedback

on:
  push:
    branches:
      - fix/instance-form-mobile-header
    paths:
      - .github/workflows/validate-instance-form-mobile-header.yml
      - .github/scripts/patch-instance-form-mobile-header.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instance-form-mobile-header
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Instance form mobile header fix
        run: |
          python .github/scripts/patch-instance-form-mobile-header.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated Instance form mobile header fix
        run: |
          rm .github/workflows/validate-instance-form-mobile-header.yml .github/scripts/patch-instance-form-mobile-header.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): stack Instance form header actions" -m "Keep Back to Instances below the New/Edit Instance header copy on narrow layouts so the 412px viewport no longer squeezes the description."
          git push origin HEAD:fix/instance-form-mobile-header
