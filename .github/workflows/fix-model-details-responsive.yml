name: Validate Model details responsive feedback

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/fix-model-details-responsive.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Model details responsive and visual QA fixes
        run: |
          python .github/scripts/patch-model-details-responsive.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated Model details fix
        run: |
          rm .github/workflows/fix-model-details-responsive.yml .github/scripts/patch-model-details-responsive.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend .github/workflows/fix-model-details-responsive.yml .github/scripts/patch-model-details-responsive.py
          git commit -m "fix(ui): make Model details mobile-friendly" -m "Let Model details header actions wrap below the intro on narrow screens and visually exercise expanded GGUF metadata across the viewport matrix."
          git push origin HEAD:feature/redesign
