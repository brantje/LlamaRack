name: Apply redesign button hierarchy

on:
  push:
    branches:
      - fix/redesign-button-hierarchy
    paths:
      - .github/workflows/apply-redesign-button-hierarchy.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/redesign-button-hierarchy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply hierarchy refactor
        run: python .github/scripts/apply-redesign-button-hierarchy.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit validated hierarchy refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "refactor(ui): separate destructive tone from button priority" -m "Introduce theme-backed destructive colors, migrate legacy destructive intents and confirmation colors, route confirmation/delete buttons through AppButton, and enforce the hierarchy in design-rule tests."
          git push origin HEAD:fix/redesign-button-hierarchy
