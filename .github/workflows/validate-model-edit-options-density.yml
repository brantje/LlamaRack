name: Validate Edit model option density feedback

on:
  push:
    branches:
      - fix/model-edit-options-density
    paths:
      - .github/workflows/validate-model-edit-options-density.yml
      - .github/scripts/patch-model-edit-options-density.py
      - .github/scripts/fix-model-edit-options-density-copy.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-edit-options-density
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Edit model option density fixes
        run: |
          python .github/scripts/patch-model-edit-options-density.py
          python .github/scripts/fix-model-edit-options-density-copy.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated Edit model option density fix
        run: |
          rm .github/workflows/validate-model-edit-options-density.yml .github/scripts/patch-model-edit-options-density.py .github/scripts/fix-model-edit-options-density-copy.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): compact inherited llama.cpp options" -m "Keep configured Model overrides prominent, present inherited options as a dense list, expose Basic/Advanced pressed state, and cover populated, dirty, and failed-save Model edit states visually."
          git push origin HEAD:fix/model-edit-options-density
