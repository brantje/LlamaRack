name: Validate Administration llama.cpp stale profile feedback

on:
  push:
    branches:
      - fix/admin-llamacpp-stale-profile
    paths:
      - .github/workflows/validate-admin-llamacpp-stale-profile.yml
      - .github/scripts/patch-admin-llamacpp-stale-profile.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-llamacpp-stale-profile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Administration llama.cpp stale-profile fixes
        run: |
          python .github/scripts/patch-admin-llamacpp-stale-profile.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated Administration llama.cpp fix
        run: |
          rm .github/workflows/validate-admin-llamacpp-stale-profile.yml .github/scripts/patch-admin-llamacpp-stale-profile.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): clear stale llama.cpp capability state" -m "Clear a previously discovered binary profile when current configuration reports none, and cover populated defaults, unavailable binary, and save-failure states visually."
          git push origin HEAD:fix/admin-llamacpp-stale-profile
