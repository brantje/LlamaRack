name: Integrate mobile header feedback

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/integrate-mobile-header-feedback.yml
      - .github/scripts/integrate-mobile-header-feedback.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply validated mobile header fixes
        run: |
          python .github/scripts/integrate-mobile-header-feedback.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated mobile header fixes
        run: |
          rm .github/workflows/integrate-mobile-header-feedback.yml .github/scripts/integrate-mobile-header-feedback.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): stack mobile page header actions" -m "Prevent the 412px viewport from squeezing Instances, Downloads, and New/Edit Instance header copy by moving their action groups below the intro on narrow layouts."
          git push origin HEAD:feature/redesign
