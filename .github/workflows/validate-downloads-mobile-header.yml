name: Validate Downloads mobile header feedback

on:
  push:
    branches:
      - fix/downloads-mobile-header
    paths:
      - .github/workflows/validate-downloads-mobile-header.yml
      - .github/scripts/patch-downloads-mobile-header.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/downloads-mobile-header
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Downloads mobile header fix
        run: |
          python .github/scripts/patch-downloads-mobile-header.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated Downloads mobile header fix
        run: |
          rm .github/workflows/validate-downloads-mobile-header.yml .github/scripts/patch-downloads-mobile-header.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): stack Downloads actions on mobile" -m "Prevent live-status and queue utilities from squeezing the Downloads description at the 412px breakpoint by stacking them below header copy on narrow layouts."
          git push origin HEAD:fix/downloads-mobile-header
