name: Integrate final model workflow feedback

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/integrate-redesign-model-workflows.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply remaining Model workflow UX fixes
        run: |
          git fetch origin 9f1963cc27c5f5e3326b3496681e921deb6cc4ba
          git show 9f1963cc27c5f5e3326b3496681e921deb6cc4ba:.github/scripts/patch-model-edit-dirty-state.py > /tmp/patch-model-edit-dirty-state.py
          python /tmp/patch-model-edit-dirty-state.py
          python .github/scripts/patch-final-model-workflows.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit integration, remove helpers and clean temporary branches
        run: |
          rm .github/workflows/integrate-redesign-model-workflows.yml .github/scripts/patch-final-model-workflows.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend .github/workflows/integrate-redesign-model-workflows.yml .github/scripts/patch-final-model-workflows.py
          git commit -m "fix(ui): finish model workflow UX feedback" -m "Clarify Model edit save state, improve Add Model mobile hierarchy and companion readability, and add copyable Model paths with accurate recovery messaging."
          git push origin HEAD:feature/redesign

          for branch in \
            fix/redesign-downloads-visual-states \
            fix/redesign-instances-controls-states \
            fix/redesign-request-log-filter-collapse \
            fix/redesign-dashboard-attention-state \
            fix/redesign-instance-form-navigation-controls \
            fix/redesign-model-form-navigation-controls \
            fix/redesign-placement-flat-surfaces \
            fix/redesign-lucide-stroke-width \
            test/redesign-document-overflow \
            fix/redesign-model-edit-dirty-state
          do
            git push origin --delete "$branch" || true
          done
