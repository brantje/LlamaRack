name: Redis release qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-huggingface-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LLAMARACK_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      LLAMARACK_LIVE_HF_QUALIFICATION: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum

      - name: Deterministic Redis invariants
        run: |
          go test ./internal/cache ./internal/huggingface -count=1
          go test ./internal/huggingface -run '^TestDerivedMetadataConcurrentColdMissCoalescesOrigin$' -count=10

      - name: Real Hugging Face Redis qualification
        run: |
          set -o pipefail
          go test ./internal/huggingface             -run '^TestLiveRedisDerivedMetadataQualification$'             -v -count=1 | tee ../redis-live-qualification.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-live-qualification-${{ github.sha }}
          path: redis-live-qualification.txt
          if-no-files-found: error
          retention-days: 90
