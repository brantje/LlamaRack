name: Apply issue label colors

on:
  push:
    paths:
      - .github/workflows/label-colors.yml

permissions:
  contents: read
  issues: write

jobs:
  colorize:
    runs-on: ubuntu-latest
    steps:
      - name: Apply label palette
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          set_color() {
            local name="$1"
            local color="$2"
            local encoded
            encoded="$(jq -rn --arg value "$name" '$value|@uri')"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/labels/${encoded}" -f "color=${color}" >/dev/null
            printf '%-28s #%s\n' "$name" "$color"
          }

          # Type
          set_color 'type: bug' D73A4A
          set_color 'type: feature' 1D76DB
          set_color 'type: enhancement' 0E8A16
          set_color 'type: refactor' 8250DF
          set_color 'type: docs' 0075CA
          set_color 'type: maintenance' 6F7781

          # Area
          set_color 'area: frontend' 7057FF
          set_color 'area: backend' 0E8A16
          set_color 'area: api' 1D76DB
          set_color 'area: auth' B60205
          set_color 'area: models' 006B75
          set_color 'area: instances' 0052CC
          set_color 'area: lifecycle' 5319E7
          set_color 'area: scheduler' FBCA04
          set_color 'area: hardware' E99695
          set_color 'area: downloads' F9D0C4
          set_color 'area: observability' 0E8A8A
          set_color 'area: llama.cpp' C2E0C6
          set_color 'area: cluster' 006B75
          set_color 'area: ci' 5319E7
          set_color 'area: deployment' 0366D6
          set_color 'area: database' BFDADC
          set_color 'area: huggingface' FEF2C0

          # Priority
          set_color 'priority: critical' B60205
          set_color 'priority: high' D93F0B
          set_color 'priority: medium' FBCA04
          set_color 'priority: low' C2E0C6

          # Workflow
          set_color 'status: blocked' B60205
          set_color 'status: needs design' D4C5F9
          set_color 'status: ready' 0E8A16
          set_color 'status: needs tests' FBCA04

          # Cross-cutting / hierarchy
          set_color 'security' B60205
          set_color 'performance' 5319E7
          set_color 'breaking change' D93F0B
          set_color 'EPIC' 5319E7
