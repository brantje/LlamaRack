name: Validate Request Logs detail state screenshots

on:
  push:
    branches:
      - test/request-log-detail-state-screenshots
    paths:
      - .github/workflows/validate-request-log-detail-state-screenshots.yml
      - .github/scripts/patch-request-log-detail-state-screenshots.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/request-log-detail-state-screenshots
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Request Logs detail state coverage
        run: |
          python .github/scripts/patch-request-log-detail-state-screenshots.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated Request Logs detail coverage
        run: |
          rm .github/workflows/validate-request-log-detail-state-screenshots.yml .github/scripts/patch-request-log-detail-state-screenshots.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(ui): cover Request Logs detail states" -m "Make visual fixtures deterministic per request and capture JSON payload, metadata-only retention, and failed-request detail states across all screenshot viewports."
          git push origin HEAD:test/request-log-detail-state-screenshots
