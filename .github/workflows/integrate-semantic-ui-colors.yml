name: Integrate semantic UI colors

on:
  push:
    branches:
      - feature/redesign
    paths:
      - .github/workflows/integrate-semantic-ui-colors.yml
      - .github/scripts/integrate-semantic-ui-colors.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply validated semantic UI color fixes
        run: |
          python .github/scripts/integrate-semantic-ui-colors.py
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run required frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run redesign screenshot suite
        working-directory: frontend
        run: npm run test:e2e:screenshots
      - name: Commit validated semantic UI colors
        run: |
          rm .github/workflows/integrate-semantic-ui-colors.yml .github/scripts/integrate-semantic-ui-colors.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): separate semantic error colors" -m "Keep primary and positive UI on the restrained accent language while routing warnings through neutral treatment and errors through theme-owned danger tokens."
          git push origin HEAD:feature/redesign
