name: llama.cpp runtime update

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: llama.cpp-runtime-update
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPOSITORY: ggml-org/llama.cpp

jobs:
  detect:
    name: Detect llama.cpp release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      release_tag: ${{ steps.runtime.outputs.release_tag }}
      build_tag: ${{ steps.runtime.outputs.build_tag }}
      image_tag: ${{ steps.detect.outputs.image_tag }}
      cpu_image: ${{ steps.runtime.outputs.cpu_image }}
      cuda_image: ${{ steps.runtime.outputs.cuda_image }}
      build_time: ${{ steps.identity.outputs.build_time }}
    steps:
      - name: Checkout manager source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest stable llama.cpp release
        id: runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLAMA_CPP_REPOSITORY: ${{ env.UPSTREAM_REPOSITORY }}
        run: bash scripts/release-qualification/resolve-llama-runtime.sh "$GITHUB_OUTPUT"

      - name: Resolve deterministic manager build time
        id: identity
        run: echo "build_time=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Detect publication state
        id: detect
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.runtime.outputs.release_tag }}
        run: |
          set -euo pipefail
          image_tag="llama.cpp-${RELEASE_TAG}"
          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'Derived llama.cpp image tag exceeds Docker tag constraints.' >&2
            exit 1
          fi
          target="${REGISTRY}/${IMAGE_NAME}:${image_tag}"
          cuda_target="${REGISTRY}/${IMAGE_NAME}:${image_tag}-cuda"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

          if docker buildx imagetools inspect "$target" >/dev/null 2>&1 && \
            docker buildx imagetools inspect "$cuda_target" >/dev/null 2>&1; then
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
            echo "llama.cpp ${RELEASE_TAG} CPU and CUDA images are already published."
          else
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
            echo "New or incomplete llama.cpp release publication detected: ${RELEASE_TAG}."
          fi

      - name: Summary
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.runtime.outputs.release_tag }}
          BUILD_TAG: ${{ steps.runtime.outputs.build_tag }}
          CPU_IMAGE: ${{ steps.runtime.outputs.cpu_image }}
          CUDA_IMAGE: ${{ steps.runtime.outputs.cuda_image }}
          SHOULD_BUILD: ${{ steps.detect.outputs.should_build }}
        run: |
          {
            echo '## 🦙 llama.cpp runtime update'
            echo
            echo "- llama.cpp release: \`${RELEASE_TAG}\`"
            echo "- llama.cpp build: \`${BUILD_TAG}\`"
            echo "- CPU runtime: \`${CPU_IMAGE}\`"
            echo "- CUDA runtime: \`${CUDA_IMAGE}\`"
            echo "- Manager source: \`${GITHUB_SHA}\`"
            if [[ "$SHOULD_BUILD" == 'true' ]]; then
              echo '- Result: new upstream release detected; images will be built.'
            else
              echo '- Result: already published; no rebuild required.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish llama.cpp update images
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manager source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            LLAMA_IMAGE=${{ needs.detect.outputs.cpu_image }}
            LLAMARACK_VERSION=development
            LLAMARACK_COMMIT=${{ github.sha }}
            LLAMARACK_BUILD_TIME=${{ needs.detect.outputs.build_time }}
            LLAMARACK_CHANNEL=development
            LLAMARACK_VARIANT=cpu
            LLAMA_CPP_RELEASE=${{ needs.detect.outputs.release_tag }}
            LLAMA_CPP_BUILD=${{ needs.detect.outputs.build_tag }}
            LLAMA_CPP_IMAGE=${{ needs.detect.outputs.cpu_image }}
          tags: |
            ghcr.io/brantje/llamarack:${{ needs.detect.outputs.image_tag }}
            ghcr.io/brantje/llamarack:llama.cpp-latest
          labels: |
            org.opencontainers.image.version=development
            org.opencontainers.image.revision=${{ github.sha }}
            io.llamarack.build.reason=llama.cpp-update
            io.llamarack.runtime.variant=cpu
            io.llamarack.llama.cpp.release=${{ needs.detect.outputs.release_tag }}
            io.llamarack.llama.cpp.build=${{ needs.detect.outputs.build_tag }}
            io.llamarack.llama.cpp.image=${{ needs.detect.outputs.cpu_image }}
          cache-from: type=gha,scope=llama.cpp-update-cpu
          cache-to: type=gha,mode=max,scope=llama.cpp-update-cpu

      - name: Build and push CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            LLAMA_IMAGE=${{ needs.detect.outputs.cuda_image }}
            LLAMARACK_VERSION=development
            LLAMARACK_COMMIT=${{ github.sha }}
            LLAMARACK_BUILD_TIME=${{ needs.detect.outputs.build_time }}
            LLAMARACK_CHANNEL=development
            LLAMARACK_VARIANT=cuda
            LLAMA_CPP_RELEASE=${{ needs.detect.outputs.release_tag }}
            LLAMA_CPP_BUILD=${{ needs.detect.outputs.build_tag }}
            LLAMA_CPP_IMAGE=${{ needs.detect.outputs.cuda_image }}
          tags: |
            ghcr.io/brantje/llamarack:${{ needs.detect.outputs.image_tag }}-cuda
            ghcr.io/brantje/llamarack:llama.cpp-latest-cuda
          labels: |
            org.opencontainers.image.version=development
            org.opencontainers.image.revision=${{ github.sha }}
            io.llamarack.build.reason=llama.cpp-update
            io.llamarack.runtime.variant=cuda
            io.llamarack.llama.cpp.release=${{ needs.detect.outputs.release_tag }}
            io.llamarack.llama.cpp.build=${{ needs.detect.outputs.build_tag }}
            io.llamarack.llama.cpp.image=${{ needs.detect.outputs.cuda_image }}
          cache-from: type=gha,scope=llama.cpp-update-cuda
          cache-to: type=gha,mode=max,scope=llama.cpp-update-cuda

      - name: Publish summary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
          BUILD_TAG: ${{ needs.detect.outputs.build_tag }}
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: |
          {
            echo '## 🦙 llama.cpp update published'
            echo
            echo "Rebuilt LlamaRack because llama.cpp released \`${RELEASE_TAG}\` (build \`${BUILD_TAG}\`)."
            echo
            echo 'Published tags:'
            echo "- \`${IMAGE_TAG}\`"
            echo "- \`${IMAGE_TAG}-cuda\`"
            echo "- \`llama.cpp-latest\`"
            echo "- \`llama.cpp-latest-cuda\`"
            echo
            echo "The normal \`latest\` and \`latest-cuda\` manager-release tags were not changed."
          } >> "$GITHUB_STEP_SUMMARY"
