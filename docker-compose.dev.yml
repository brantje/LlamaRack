services:
  backend:
    build:
      context: ./backend
      args:
        LLAMA_IMAGE: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    environment:
      LLAMARACK_LISTEN_ADDR: :8000
      LLAMARACK_DATA_DIR: /config
      LLAMARACK_MODELS_DIR: /models
      LLAMARACK_LLAMA_SERVER: /app/llama-server
      LLAMARACK_HOST_PROC: /host/proc
      LLAMARACK_ALLOWED_ORIGIN: ${LLAMARACK_ALLOWED_ORIGIN:-http://localhost:3000}
      LLAMARACK_ALWAYS_ON_RECONCILE_SECONDS: ${LLAMARACK_ALWAYS_ON_RECONCILE_SECONDS:-15}
    volumes:
      - ./data/config:/config
      - ${LLAMARACK_HOST_MODELS_DIR:-./data/models}:/models
      - /proc:/host/proc:ro
    ports:
      - "8888:8000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/llamarack", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend_node_modules:
