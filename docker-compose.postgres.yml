services:
  llamarack:
    environment:
      LLAMARACK_DATABASE_URL: "postgres://llamarack:${LLAMARACK_POSTGRES_PASSWORD:?set LLAMARACK_POSTGRES_PASSWORD}@postgres:5432/llamarack?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: llamarack
      POSTGRES_USER: llamarack
      POSTGRES_PASSWORD: "${LLAMARACK_POSTGRES_PASSWORD:?set LLAMARACK_POSTGRES_PASSWORD}"
    volumes:
      - llamarack-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llamarack -d llamarack"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  llamarack-postgres:
