services:
  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8888
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: golang:1.27-bookworm
    working_dir: /app
    command: go run ./cmd/llamacpp-manager
    environment:
      LCM_LISTEN_ADDR: :8000
    volumes:
      - ./backend:/app
      - backend_go_build_cache:/root/.cache/go-build
      - backend_go_mod_cache:/go/pkg/mod
    ports:
      - "8888:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 &&
          printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
          grep -q "200 OK" <&3'
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_go_build_cache:
  backend_go_mod_cache:
