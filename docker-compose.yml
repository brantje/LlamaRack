services:
  backend:
    build:
      context: ./backend
      args:
        LLAMA_IMAGE: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    environment:
      LCM_LISTEN_ADDR: :8000
      LCM_DATA_DIR: /config
      LCM_MODELS_DIR: /models
      LCM_LLAMA_SERVER: /app/llama-server
      LCM_ALLOWED_ORIGIN: ${LCM_ALLOWED_ORIGIN:-http://localhost:3000}
      LCM_ALWAYS_ON_RECONCILE_SECONDS: ${LCM_ALWAYS_ON_RECONCILE_SECONDS:-15}
    volumes:
      - ./data/config:/config
      - ./data/models:/models
    ports:
      - "8888:8000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/llamacpp-manager", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend_node_modules:
